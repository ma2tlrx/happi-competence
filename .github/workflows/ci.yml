# Intégration continue : qualité du code et build, puis tests d'isolation contre une pile
# Supabase locale démarrée dans le runner (clés générées sur place, aucun secret requis).
name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Valeurs factices : le build ne contacte aucun service.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-publique-factice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build

  securite:
    name: Tests de sécurité (RLS) sur pile Supabase locale
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PostgreSQL, authentification, PostgREST, passerelle et Mailpit (Docker), puis toutes les migrations.
      # Les clés JWT sont générées dans supabase/local/.generated et .env.local, propres à ce runner.
      - name: Démarrage de la pile locale
        run: node scripts/local-stack.mjs start
      - name: Tests de sécurité
        run: npx vitest run --project security
      - name: Journaux de la pile (en cas d'échec)
        if: failure()
        run: docker compose -f supabase/local/docker-compose.yml logs --tail=200
      - name: Arrêt de la pile
        if: always()
        run: node scripts/local-stack.mjs stop
