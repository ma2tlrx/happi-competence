<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>HAPPI Compétence — vidéo</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="bg"></div>
      <div id="glows"></div>
      <svg id="grid" width="1920" height="1080">
        <defs>
          <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
            <circle cx="24" cy="24" r="1.4" fill="rgba(255,255,255,0.28)" />
          </pattern>
          <radialGradient id="gridfade" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#fff" stop-opacity="1" />
            <stop offset="100%" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <mask id="gridmask"><rect width="1920" height="1080" fill="url(#gridfade)" /></mask>
        </defs>
        <rect width="1920" height="1080" fill="url(#dots)" mask="url(#gridmask)" />
      </svg>
      <canvas id="particles" width="1920" height="1080"></canvas>
      <div id="camera"></div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <canvas id="grain" width="1920" height="1080"></canvas>
      <div id="fade"></div>
    </div>
    <script src="./node_modules/gsap/dist/gsap.min.js"></script>
    <script src="./node_modules/gsap/dist/CustomEase.min.js"></script>
    <script src="./node_modules/gsap/dist/SplitText.min.js"></script>
    <script src="./node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
    <script src="./node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
    <script src="./node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
